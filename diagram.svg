<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">
    MCP (Model Context Protocol) Flow
  </text>
  
  <!-- Components -->
  <!-- User -->
  <rect x="400" y="60" width="200" height="60" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2" rx="5"/>
  <text x="500" y="95" font-size="18" font-weight="bold" text-anchor="middle" fill="white">User</text>
  
  <!-- Client (Orchestrator) -->
  <rect x="350" y="300" width="300" height="80" fill="#50C878" stroke="#2E7D4E" stroke-width="3" rx="5"/>
  <text x="500" y="335" font-size="20" font-weight="bold" text-anchor="middle" fill="white">Client</text>
  <text x="500" y="360" font-size="14" text-anchor="middle" fill="white">(Orchestrator)</text>
  
  <!-- LLM -->
  <rect x="700" y="300" width="200" height="80" fill="#E8833A" stroke="#B85A1F" stroke-width="2" rx="5"/>
  <text x="800" y="335" font-size="18" font-weight="bold" text-anchor="middle" fill="white">LLM</text>
  <text x="800" y="360" font-size="12" text-anchor="middle" fill="white">(Claude, GPT, etc.)</text>
  
  <!-- MCP Servers -->
  <rect x="50" y="280" width="180" height="60" fill="#9B59B6" stroke="#6A3A7C" stroke-width="2" rx="5"/>
  <text x="140" y="310" font-size="16" font-weight="bold" text-anchor="middle" fill="white">MCP Server 1</text>
  <text x="140" y="330" font-size="11" text-anchor="middle" fill="white">(e.g., Filesystem)</text>
  
  <rect x="50" y="360" width="180" height="60" fill="#9B59B6" stroke="#6A3A7C" stroke-width="2" rx="5"/>
  <text x="140" y="390" font-size="16" font-weight="bold" text-anchor="middle" fill="white">MCP Server 2</text>
  <text x="140" y="410" font-size="11" text-anchor="middle" fill="white">(e.g., Database)</text>
  
  <rect x="50" y="440" width="180" height="60" fill="#9B59B6" stroke="#6A3A7C" stroke-width="2" rx="5"/>
  <text x="140" y="470" font-size="16" font-weight="bold" text-anchor="middle" fill="white">MCP Server N</text>
  <text x="140" y="490" font-size="11" text-anchor="middle" fill="white">(e.g., API)</text>
  
  <!-- Flow Steps -->
  <!-- Step 0: Initialization -->
  <text x="50" y="560" font-size="16" font-weight="bold" fill="#333">0. Initialization:</text>
  <line x1="230" y1="320" x2="350" y2="330" stroke="#9B59B6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="250" y="310" font-size="12" fill="#9B59B6">Tools available</text>
  
  <!-- Step 1: User prompt -->
  <line x1="500" y1="120" x2="500" y2="300" stroke="#4A90E2" stroke-width="3" marker-end="url(#arrowhead-blue)"/>
  <text x="520" y="210" font-size="14" font-weight="bold" fill="#4A90E2">① User Prompt</text>
  
  <!-- Step 2: Client to LLM with tools -->
  <line x1="650" y1="330" x2="700" y2="330" stroke="#50C878" stroke-width="3" marker-end="url(#arrowhead-green)"/>
  <text x="620" y="320" font-size="12" font-weight="bold" fill="#50C878">② Prompt +</text>
  <text x="620" y="335" font-size="12" font-weight="bold" fill="#50C878">Tool List</text>
  
  <!-- Step 3: LLM decides tools -->
  <line x1="700" y1="350" x2="650" y2="350" stroke="#E8833A" stroke-width="3" marker-end="url(#arrowhead-orange)"/>
  <text x="720" y="365" font-size="12" font-weight="bold" fill="#E8833A">③ Tool Call</text>
  <text x="720" y="380" font-size="12" font-weight="bold" fill="#E8833A">Request</text>
  
  <!-- Step 4: Client to MCP Server -->
  <line x1="350" y1="350" x2="230" y2="380" stroke="#50C878" stroke-width="3" marker-end="url(#arrowhead-green)"/>
  <text x="250" y="370" font-size="12" font-weight="bold" fill="#50C878">④ Execute Tool</text>
  
  <!-- Step 5: MCP Server results -->
  <line x1="230" y1="400" x2="350" y2="360" stroke="#9B59B6" stroke-width="3" marker-end="url(#arrowhead-purple)"/>
  <text x="250" y="420" font-size="12" font-weight="bold" fill="#9B59B6">⑤ Results</text>
  
  <!-- Step 6: Client to LLM with results -->
  <line x1="650" y1="360" x2="700" y2="360" stroke="#50C878" stroke-width="3" marker-end="url(#arrowhead-green)" stroke-dasharray="5,5"/>
  <text x="620" y="395" font-size="12" font-weight="bold" fill="#50C878">⑥ Tool</text>
  <text x="620" y="410" font-size="12" font-weight="bold" fill="#50C878">Results</text>
  
  <!-- Step 7: Final response -->
  <line x1="500" y1="300" x2="500" y2="120" stroke="#E8833A" stroke-width="3" marker-end="url(#arrowhead-orange)" stroke-dasharray="5,5"/>
  <text x="380" y="210" font-size="14" font-weight="bold" fill="#E8833A">⑦ Final Answer</text>
  
  <!-- Legend -->
  <rect x="50" y="620" width="900" height="150" fill="#F5F5F5" stroke="#999" stroke-width="1" rx="5"/>
  <text x="500" y="645" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Process Flow:</text>
  
  <text x="70" y="670" font-size="13" fill="#333"><tspan font-weight="bold">0. Initialization:</tspan> MCP Servers connect and advertise their tools/resources</text>
  <text x="70" y="690" font-size="13" fill="#333"><tspan font-weight="bold">①-②:</tspan> User sends prompt → Client forwards to LLM with available tools</text>
  <text x="70" y="710" font-size="13" fill="#333"><tspan font-weight="bold">③:</tspan> LLM analyzes and decides which tool(s) to call</text>
  <text x="70" y="730" font-size="13" fill="#333"><tspan font-weight="bold">④-⑤:</tspan> Client executes tool on MCP Server → gets results</text>
  <text x="70" y="750" font-size="13" fill="#333"><tspan font-weight="bold">⑥-⑦:</tspan> Results sent back to LLM → LLM generates final response to user</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9B59B6" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4A90E2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#50C878" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#E8833A" />
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9B59B6" />
    </marker>
  </defs>
</svg>